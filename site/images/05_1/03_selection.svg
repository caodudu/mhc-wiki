<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 650" width="1240" height="650"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52766e"/></marker></defs><rect width="100%" height="100%" fill="#fffdfa"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#204c46}.t{font-size:19px}.small{font-size:16px}</style><text x="34" y="42" font-size="26" font-weight="bold">从蛋白存在到表面展示：选择发生在哪里</text><text x="34" y="73" class="small">各环节可以生成、富集或排除肽；箭头不代表等比例转换</text><rect x="50" y="165" width="210" height="100" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="66" y="196" class="t">抗原可获得性</text><text x="66" y="224" class="t">表达、合成、摄取</text><path d="M260,215 L285,215" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><rect x="50" y="335" width="210" height="96" rx="12" fill="#fff0dc" stroke="#9bbfb2"/><text x="66" y="366" class="t">没有进入路径</text><text x="66" y="394" class="t">呈递量可降低</text><path d="M155,265 L155,335" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-dasharray="7 5"/><rect x="285" y="165" width="210" height="100" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="301" y="196" class="t">加工与供肽</text><text x="301" y="224" class="t">切割、修剪、降解</text><path d="M495,215 L520,215" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><rect x="285" y="335" width="210" height="96" rx="12" fill="#fff0dc" stroke="#9bbfb2"/><text x="301" y="366" class="t">片段被破坏</text><text x="301" y="394" class="t">呈递量可降低</text><path d="M390,265 L390,335" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-dasharray="7 5"/><rect x="520" y="165" width="210" height="100" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="536" y="196" class="t">转运与相遇</text><text x="536" y="224" class="t">区室、TAP、运输</text><path d="M730,215 L755,215" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><rect x="520" y="335" width="210" height="96" rx="12" fill="#fff0dc" stroke="#9bbfb2"/><text x="536" y="366" class="t">未到装载区室</text><text x="536" y="394" class="t">呈递量可降低</text><path d="M625,265 L625,335" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-dasharray="7 5"/><rect x="755" y="165" width="210" height="100" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="771" y="196" class="t">装载与编辑</text><text x="771" y="224" class="t">HLA偏好、伴侣</text><path d="M965,215 L990,215" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><rect x="755" y="335" width="210" height="96" rx="12" fill="#fff0dc" stroke="#9bbfb2"/><text x="771" y="366" class="t">结合 / 交换受限</text><text x="771" y="394" class="t">呈递量可降低</text><path d="M860,265 L860,335" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-dasharray="7 5"/><rect x="990" y="165" width="210" height="100" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="1006" y="196" class="t">表面维持</text><text x="1006" y="224" class="t">稳定性、运输、周转</text><rect x="990" y="335" width="210" height="96" rx="12" fill="#fff0dc" stroke="#9bbfb2"/><text x="1006" y="366" class="t">复合物丢失</text><text x="1006" y="394" class="t">呈递量可降低</text><path d="M1095,265 L1095,335" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-dasharray="7 5"/><rect x="180" y="515" width="890" height="78" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="196" y="546" class="t">同一蛋白可贡献多条肽；同一条肽的呈递还依赖具体HLA及细胞条件</text></svg>