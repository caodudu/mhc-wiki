<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" width="1240" height="520"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52766e"/></marker></defs><rect width="100%" height="100%" fill="#fffdfa"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#204c46}.t{font-size:19px}.small{font-size:16px}</style><text x="34" y="42" font-size="26" font-weight="bold">MHC限制性：结合偏好与受体库筛选</text><text x="34" y="73" class="small">两个解释层级并列；不将模型画成已解决的唯一机制</text><rect x="70" y="145" width="480" height="145" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="86" y="176" class="t">胚系偏好模型</text><text x="86" y="204" class="t">保守TCR / MHC接触</text><text x="86" y="232" class="t">解释相互作用的内在偏好</text><rect x="690" y="145" width="480" height="145" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="706" y="176" class="t">胸腺选择模型</text><text x="706" y="204" class="t">CD4 / CD8与Lck信号条件</text><text x="706" y="232" class="t">解释哪些受体通过选择</text><path d="M310,290 L570,385" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><path d="M930,290 L675,385" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><rect x="420" y="385" width="420" height="85" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="436" y="416" class="t">正常常规αβ T细胞的MHC识别</text></svg>