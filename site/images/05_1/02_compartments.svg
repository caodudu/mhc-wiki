<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52766e"/></marker></defs><rect width="100%" height="100%" fill="#fffdfa"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#204c46}.t{font-size:19px}.small{font-size:16px}</style><text x="34" y="42" font-size="26" font-weight="bold">Ⅰ类与Ⅱ类：蛋白与分子相遇的区室</text><text x="34" y="73" class="small">典型路径并列；交叉路径以虚线表示，不表示所有细胞均具有相同能力</text><text x="35" y="150" font-size="25">Ⅰ类</text><text x="35" y="375" font-size="25">Ⅱ类</text><rect x="135" y="110" width="220" height="110" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="151" y="141" class="t">胞质蛋白</text><text x="151" y="169" class="t">自身 / 外源编码</text><rect x="420" y="110" width="220" height="110" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="436" y="141" class="t">蛋白酶体 → TAP</text><text x="436" y="169" class="t">肽进入ER</text><rect x="705" y="110" width="220" height="110" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="721" y="141" class="t">Ⅰ类重链 + β₂m</text><text x="721" y="169" class="t">装载与质量控制</text><rect x="1000" y="110" width="220" height="110" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="1016" y="141" class="t">表面pMHC-I</text><text x="1016" y="169" class="t">CD8 T细胞</text><rect x="135" y="335" width="220" height="110" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="151" y="366" class="t">摄取外源蛋白</text><text x="151" y="394" class="t">内体 / 吞噬体</text><rect x="420" y="335" width="220" height="110" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="436" y="366" class="t">内体蛋白水解</text><text x="436" y="394" class="t">与Ⅱ类分子汇合</text><rect x="705" y="335" width="220" height="110" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="721" y="366" class="t">Ii → CLIP → DM</text><text x="721" y="394" class="t">Ⅱ类抗原肽装载</text><rect x="1000" y="335" width="220" height="110" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="1016" y="366" class="t">表面pMHC-II</text><text x="1016" y="394" class="t">CD4 T细胞</text><path d="M355,160 L420,160" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><path d="M640,160 L705,160" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><path d="M925,160 L990,160" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><path d="M355,385 L420,385" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><path d="M640,385 L705,385" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><path d="M925,385 L990,385" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><path d="M245,335 L530,220" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="270" y="280" font-size="17">外源 → Ⅰ类：交叉呈递</text><path d="M245,220 L530,335" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="610" y="295" font-size="17">胞内 → Ⅱ类：自噬等路径</text><text x="135" y="525" font-size="22">内源 / 外源：相对于承担呈递的那一个细胞定义</text><text x="135" y="570" font-size="20">装载发生的区室，与抗原最初进入的区室，需要分别辨认</text></svg>