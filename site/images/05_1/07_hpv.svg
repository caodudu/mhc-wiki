<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 650" width="1240" height="650"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52766e"/></marker></defs><rect width="100%" height="100%" fill="#fffdfa"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#204c46}.t{font-size:19px}.small{font-size:16px}</style><text x="34" y="42" font-size="26" font-weight="bold">HPV16 E7：先前未响应细胞的再刺激</text><text x="34" y="73" class="small">2016原研究Fig. 6；定性重绘，不读取或模拟原图柱高</text><text x="40" y="130" font-size="21">初始CD8 T细胞</text><text x="40" y="325" font-size="21">已诱导响应的CD8 T细胞</text><rect x="40" y="155" width="335" height="110" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="56" y="186" class="t">第0–14天：HPV颗粒LC</text><text x="56" y="214" class="t">E7特异性响应弱 / 未响应</text><rect x="475" y="155" width="335" height="110" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="491" y="186" class="t">第14–28天：换为</text><text x="491" y="214" class="t">E7肽 + Poly-ICLC LC</text><rect x="910" y="155" width="290" height="110" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="926" y="186" class="t">再次检测</text><text x="926" y="214" class="t">可产生E7响应</text><path d="M375,210 L475,210" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><path d="M810,210 L910,210" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><rect x="40" y="350" width="335" height="110" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="56" y="381" class="t">第0–14天：E7肽 +</text><text x="56" y="409" class="t">Poly-ICLC活化LC</text><rect x="475" y="350" width="335" height="110" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="491" y="381" class="t">第14–28天：换为</text><text x="491" y="409" class="t">HPV颗粒LC</text><rect x="910" y="350" width="290" height="110" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="926" y="381" class="t">保留E7响应</text><text x="926" y="409" class="t">扩增弱于持续活化组</text><path d="M375,405 L475,405" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><path d="M810,405 L910,405" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><rect x="110" y="535" width="1020" height="75" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="126" y="566" class="t">抗原递送形式与LC活化同时变化；差异不能单独归因于CD28</text></svg>