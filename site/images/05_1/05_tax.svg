<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" width="1240" height="520"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52766e"/></marker></defs><rect width="100%" height="100%" fill="#fffdfa"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#204c46}.t{font-size:19px}.small{font-size:16px}</style><text x="34" y="42" font-size="26" font-weight="bold">Tax / HLA-A*02:01：HLA表面位点影响A6识别</text><text x="34" y="73" class="small">Baker 2001 Fig. 2–7；标记位点示意，不是原子坐标图</text><rect x="80" y="130" width="470" height="115" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="96" y="161" class="t">同一Tax肽：LLFGYPVYV</text><text x="96" y="189" class="t">不同HLA接触位点突变</text><rect x="680" y="130" width="470" height="115" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="696" y="161" class="t">同一TCR：A6</text><text x="696" y="189" class="t">结合、信号与CTL功能分别测量</text><path d="M550,187 L680,187" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><rect x="155" y="309.4" width="92" height="130.6" fill="#63a392"/><text x="147" y="470" font-size="19">WT</text><text x="147" y="290" font-size="18">65.3 °C</text><rect x="415" y="303.4" width="92" height="136.6" fill="#63a392"/><text x="407" y="470" font-size="19">R65A</text><text x="407" y="290" font-size="18">68.3 °C</text><rect x="675" y="314.0" width="92" height="126.0" fill="#63a392"/><text x="667" y="470" font-size="19">K66A</text><text x="667" y="290" font-size="18">63.0 °C</text><rect x="935" y="311.8" width="92" height="128.2" fill="#63a392"/><text x="927" y="470" font-size="19">A69G</text><text x="927" y="290" font-size="18">64.1 °C</text><text x="45" y="510" font-size="18">热稳定性用于核对肽–HLA受损的可能；不能直接代替TCR结合测量</text></svg>