<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" width="1240" height="520"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52766e"/></marker></defs><rect width="100%" height="100%" fill="#fffdfa"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#204c46}.t{font-size:19px}.small{font-size:16px}</style><text x="34" y="42" font-size="26" font-weight="bold">呈递中的对象层级</text><text x="34" y="73" class="small">蛋白、肽、HLA复合物与TCR识别分别对应不同对象；示意，无比例关系</text><rect x="35" y="150" width="270" height="120" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="51" y="181" class="t">来源蛋白</text><text x="51" y="209" class="t">包含多个潜在片段</text><rect x="335" y="150" width="270" height="120" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="351" y="181" class="t">加工后的肽集合</text><text x="351" y="209" class="t">部分被继续降解</text><rect x="635" y="150" width="270" height="120" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="651" y="181" class="t">特定肽 + HLA</text><text x="651" y="209" class="t">形成pHLA复合物</text><rect x="935" y="150" width="270" height="120" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="951" y="181" class="t">表面pHLA</text><text x="951" y="209" class="t">可接触相应TCR</text><path d="M305,208 L335,208" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><path d="M605,208 L635,208" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><path d="M905,208 L935,208" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" /><rect x="80" y="345" width="470" height="90" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="96" y="376" class="t">HLA分子总量 ≠ 某种pHLA的数量</text><rect x="650" y="345" width="470" height="90" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="666" y="376" class="t">检出HLA结合肽 ≠ 已证明T细胞响应</text></svg>