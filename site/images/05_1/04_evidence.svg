<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" width="1240" height="520"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52766e"/></marker></defs><rect width="100%" height="100%" fill="#fffdfa"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#204c46}.t{font-size:19px}.small{font-size:16px}</style><text x="34" y="42" font-size="26" font-weight="bold">HLA结合与呈递证据的不同实验对象</text><text x="34" y="73" class="small">依据Hunt 1992、Bassani-Sternberg 2015、Abelin 2017整理</text><rect x="45" y="150" width="350" height="145" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="61" y="181" class="t">结合实验</text><text x="61" y="209" class="t">给定肽 + 给定HLA</text><text x="61" y="237" class="t">测结合 / 稳定性</text><rect x="445" y="150" width="350" height="145" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="461" y="181" class="t">天然HLA肽谱</text><text x="461" y="209" class="t">细胞中回收HLA结合肽</text><text x="461" y="237" class="t">同时包含加工与装载选择</text><rect x="845" y="150" width="350" height="145" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="861" y="181" class="t">T细胞功能实验</text><text x="861" y="209" class="t">pHLA + 特定T细胞</text><text x="861" y="237" class="t">测响应 / 杀伤等</text><path d="M395,220 L445,220" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-dasharray="7 5"/><path d="M795,220 L845,220" stroke="#52766e" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-dasharray="7 5"/><rect x="85" y="365" width="1070" height="90" rx="12" fill="#e9f4f0" stroke="#9bbfb2"/><text x="101" y="396" class="t">三个实验对象相互联系；任何一项阳性都不自动证明另外两项阳性</text></svg>